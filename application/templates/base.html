<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Registration Automation{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  {% block styles %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block content %}{% endblock %}
  {% block footer %}
    <footer class="site-footer" aria-label="Developer credit">
      <p class="footer-credit">Made with <span class="footer-heart" aria-hidden="true">❤️</span> by <span class="footer-name">Muskan</span></p>
      <p class="footer-signature">Muskan Sunder</p>
    </footer>
  {% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
