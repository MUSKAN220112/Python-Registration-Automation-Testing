[pytest]
testpaths = tests api_tests
python_files = test_*.py
addopts = -ra --strict-markers --html=reports/pytest-report.html --self-contained-html --alluredir=reports/allure-results -m "not ui"
markers =
    ui: Selenium browser tests (run with pytest -m ui)
    api: HTTP API tests
    database: persistence and database tests
